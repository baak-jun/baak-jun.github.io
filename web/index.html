<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="망치든 개발자의 포트폴리오">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="망치든 개발자">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>망치든 개발자 포트폴리오</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --paper: #fffcf6;
      --ink: #2d2926;
      --accent: #b96a3b;
      --green: #347260;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      overflow: hidden;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(185, 106, 59, 0.10), transparent 30%),
        var(--paper);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 520ms ease, visibility 520ms ease;
    }

    #app-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-stage {
      display: grid;
      justify-items: center;
      gap: 22px;
      padding: 32px;
    }

    .hammer-scene {
      position: relative;
      width: 200px;
      height: 140px;
    }

    .hammer {
      position: absolute;
      left: 72px;
      top: 16px;
      width: 72px;
      height: 82px;
      transform-origin: 28px 82px;
      animation: hammer-hit 560ms cubic-bezier(0.45, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    .hammer-head {
      position: absolute;
      left: 2px;
      top: 6px;
      width: 52px;
      height: 22px;
      border-radius: 6px;
      background: var(--ink);
      box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.14);
    }

    .hammer-claw {
      position: absolute;
      left: 45px;
      top: 7px;
      width: 20px;
      height: 20px;
      border: 6px solid var(--ink);
      border-left: 0;
      border-bottom: 0;
      border-radius: 0 12px 0 0;
    }

    .hammer-handle {
      position: absolute;
      left: 22px;
      top: 24px;
      width: 13px;
      height: 62px;
      border-radius: 8px;
      background: var(--accent);
      transform: rotate(0);
      transform-origin: top center;
    }

    .laptop {
      position: absolute;
      left: 16px;
      bottom: 18px;
      width: 120px;
      height: 74px;
      transform-origin: center bottom;
      animation: laptop-shake 560ms cubic-bezier(0.45, 0, 0.2, 1) infinite;
      will-change: transform;
    }

    .laptop-screen {
      position: absolute;
      left: 18px;
      top: 0;
      width: 84px;
      height: 56px;
      border: 7px solid var(--ink);
      border-radius: 8px 8px 4px 4px;
      background: linear-gradient(135deg, rgba(52, 114, 96, 0.18), rgba(185, 106, 59, 0.12));
      box-sizing: border-box;
    }

    .laptop-screen::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      top: 20px;
      height: 4px;
      border-radius: 999px;
      background: rgba(45, 41, 38, 0.28);
      box-shadow: 0 10px 0 rgba(45, 41, 38, 0.16);
    }

    .laptop-base {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 120px;
      height: 18px;
      border-radius: 4px 4px 12px 12px;
      background: var(--green);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12);
    }

    .laptop-base::after {
      content: "";
      position: absolute;
      left: 48px;
      top: 4px;
      width: 24px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
    }

    .spark {
      position: absolute;
      left: 98px;
      top: 40px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0;
      animation: spark-pop 560ms ease-out infinite;
    }

    .spark:nth-child(4) {
      transform: rotate(35deg) translateX(30px);
      animation-delay: 40ms;
    }

    .spark:nth-child(5) {
      transform: rotate(145deg) translateX(28px);
      animation-delay: 80ms;
    }

    .impact-ring {
      position: absolute;
      left: 84px;
      top: 28px;
      width: 30px;
      height: 30px;
      border: 2px solid var(--accent);
      border-radius: 999px;
      opacity: 0;
      animation: impact-ring 560ms ease-out infinite;
    }

    .loader-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .loader-copy {
      margin: 0;
      font-size: 14px;
      color: rgba(45, 41, 38, 0.68);
    }

    @keyframes hammer-hit {
      0% {
        transform: translate(46px, -28px) rotate(-72deg);
      }

      36% {
        transform: translate(0, 0) rotate(0deg);
      }

      46% {
        transform: translate(0, -3px) rotate(-7deg);
      }

      100% {
        transform: translate(46px, -28px) rotate(-72deg);
      }
    }

    @keyframes laptop-shake {
      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      44% {
        transform: translateY(6px) rotate(-5deg);
      }

      54% {
        transform: translateY(-7px) rotate(5deg);
      }

      66% {
        transform: translateY(4px) rotate(-3deg);
      }

      82% {
        transform: translateY(0) rotate(2deg);
      }
    }

    @keyframes impact-ring {
      0%,
      42% {
        opacity: 0;
        transform: scale(0.4);
      }

      44% {
        opacity: 0.72;
        transform: scale(0.8);
      }

      78%,
      100% {
        opacity: 0;
        transform: scale(1.9);
      }
    }

    @keyframes spark-pop {
      0%,
      44% {
        opacity: 0;
        scale: 0.4;
      }

      48% {
        opacity: 1;
        scale: 1;
      }

      78%,
      100% {
        opacity: 0;
        scale: 1.8;
      }
    }

  </style>
</head>
<body>
  <div id="app-loader" aria-label="포트폴리오 로딩 중" role="status">
    <div class="loader-stage">
      <div class="hammer-scene" aria-hidden="true">
        <div class="hammer">
          <div class="hammer-head"></div>
          <div class="hammer-claw"></div>
          <div class="hammer-handle"></div>
        </div>
        <div class="laptop">
          <div class="laptop-screen"></div>
          <div class="laptop-base"></div>
        </div>
        <div class="spark"></div>
        <div class="spark"></div>
        <div class="impact-ring"></div>
      </div>
      <p class="loader-title">망치든 개발자</p>
      <p class="loader-copy">로딩될 때 까지 컴퓨터 두드리는 중</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (!loader) {
        return;
      }

      window.setTimeout(function () {
        loader.classList.add('loader-hidden');
        document.body.style.overflow = '';
        window.setTimeout(function () {
          loader.remove();
        }, 620);
      }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
